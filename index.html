<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Máquinas Virtuais: A Saga - Super Mario World Retrô</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a10;overflow:hidden;font-family:'Press Start 2P','Courier New',monospace;color:#fff;-webkit-tap-highlight-color:transparent}

/* Viewport principal 960x540 escalonado */
#g{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#5c94fc;user-select:none;box-shadow:0 0 45px rgba(0,0,0,0.95)}
.sc{position:absolute;inset:0;display:none;overflow:hidden}.sc.on{display:block}
.s{position:absolute;image-rendering:pixelated}

/* Cenário Céu e Nuvens */
.sky{position:absolute;inset:0;background:linear-gradient(#3878f0,#7cb4ff 65%,#bfe2ff)}
.cl{position:absolute;width:120px;height:36px;background:#fff;border-radius:22px;box-shadow:34px -16px 0 6px #fff,68px 2px 0 2px #fff;animation:dr 45s linear infinite;opacity:.95}
@keyframes dr{from{transform:translateX(-220px)}to{transform:translateX(1160px)}}

/* Colinas clássicas do Super Mario World */
.hill{position:absolute;bottom:90px;background:#24b024;border:5px solid #004d00;border-radius:100px 100px 0 0;box-shadow:inset -22px 0 #167a16,inset 12px 0 #3ae03a}
.hill:before,.hill:after{content:"";position:absolute;top:28%;width:9px;height:24px;background:#000;border-radius:4px;left:38%}.hill:after{left:58%}

/* Arbustos */
.bush{position:absolute;bottom:90px;height:42px;background:#18c818;border:4px solid #004d00;border-radius:24px 24px 0 0;box-shadow:inset 0 -8px #0d800d}

/* Chão clássico quadriculado SMW */
.gr{position:absolute;left:0;right:0;bottom:0;height:90px;background:radial-gradient(#f0b060 2px,transparent 3px) 0 0/16px 16px,linear-gradient(#2cd02c 0 14px,#005000 14px 18px,#c07830 18px);background-color:#c07830;border-top:4px solid #000;z-index:4}

/* Bloco de Interrogação clássico (?) */
.q{position:absolute;width:64px;height:64px;background:#f8b800;border:4px solid #000;box-shadow:inset 4px 4px #ffe478,inset -4px -4px #b87000,0 6px rgba(0,0,0,0.3);font-size:36px;line-height:56px;text-align:center;color:#fff;text-shadow:3px 3px #000;animation:qglow 1.2s steps(2) infinite;z-index:6}
@keyframes qglow{0%,100%{background:#f8b800}50%{background:#fcd038}}
.q.hit{transform:translateY(-16px);transition:transform .1s cubic-bezier(.1,.9,.2,1)}
.q.used{background:#985820;box-shadow:inset 4px 4px #c07838,inset -4px -4px #603010;color:transparent;animation:none}

.bob{animation:bob .28s steps(2) infinite}@keyframes bob{50%{transform:translateY(-6px)}}

/* Botões com estética retrô arcade */
.btn{font:inherit;font-size:12px;color:#fff;background:#e52521;border:4px solid #000;box-shadow:inset 0 -6px #940f0c,inset 0 4px #ff7065,4px 4px 0 rgba(0,0,0,0.4);padding:12px 18px;cursor:pointer;text-shadow:2px 2px #000;letter-spacing:1px;border-radius:4px}
.btn:hover{filter:brightness(1.18);transform:translateY(-2px)}
.btn:active{transform:translate(2px,2px);box-shadow:inset 0 -2px #940f0c,inset 0 2px #ff7065}
.btn.b{background:#1840f0;box-shadow:inset 0 -6px #0b1f8f,inset 0 4px #6585ff,4px 4px 0 rgba(0,0,0,0.4)}
.btn.y{background:#f8b800;color:#000;text-shadow:none;box-shadow:inset 0 -6px #a86800,inset 0 4px #ffec80,4px 4px 0 rgba(0,0,0,0.4)}
.btn.g{background:#20b820;box-shadow:inset 0 -6px #0d6b0d,inset 0 4px #68ea68,4px 4px 0 rgba(0,0,0,0.4)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}

/* Cortina de transição */
#f{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:90}

/* Logo Oficial do SENAI Pixelizada */
#logo{position:absolute;right:14px;top:12px;z-index:45;background:#ffffff;border:4px solid #000;border-radius:8px;padding:6px 12px;box-shadow:4px 4px 0 rgba(0,0,0,0.5)}
#logo img{display:block;width:130px;height:auto}

/* Botão de Som */
#mu{position:absolute;left:14px;top:12px;z-index:45;font-size:15px;background:#000000bb;border:3px solid #fff;color:#fff;padding:8px 10px;cursor:pointer;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,0.5)}
#mu:hover{background:#e52521}

/* Título estilizado Super Mario */
.ttl{font-size:42px;line-height:52px;text-align:center;text-shadow:4px 4px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
.c0{color:#f83838}.c1{color:#18d0f8}.c2{color:#f8d018}.c3{color:#20d820}
#ttl{position:absolute;left:0;right:0;top:45px;opacity:0;transform:translateY(180px) scale(.2);transition:all .8s cubic-bezier(.2,1.35,.4,1);z-index:10}
#ttl.show{opacity:1;transform:none}
#ttl small{display:block;font-size:20px;margin-top:8px}

#sb{position:absolute;left:50%;top:355px;transform:translateX(-50%);font-size:16px;opacity:0;pointer-events:none;transition:opacity .4s;z-index:15}
#sb.show{opacity:1;pointer-events:auto;animation:pul 1s steps(2) infinite}
@keyframes pul{50%{transform:translateX(-50%) translateY(-6px)}}

.cred{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:9px;line-height:16px;color:#fff;text-shadow:2px 2px #000;padding:0 150px;z-index:5}

/* Mapa Mundi estilo Super Mario World */
.sea{position:absolute;inset:0;background:repeating-linear-gradient(#2870ea 0 16px,#3b82fc 16px 22px);animation:seamove 4s linear infinite}
@keyframes seamove{0%{background-position:0 0}100%{background-position:0 22px}}
.isl{position:absolute;left:50px;top:65px;width:860px;height:410px;background:#44c828;border:14px solid #c8843c;border-radius:55px;box-shadow:inset 0 0 0 8px #2b9c16,6px 6px 0 rgba(0,0,0,0.4)}
.nd{position:absolute;width:52px;height:52px;border:5px solid #000;border-radius:50%;cursor:pointer;background:#888;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:8;box-shadow:3px 3px 0 rgba(0,0,0,0.5);transition:transform .15s}
.nd.open{background:#f8d818;animation:ndpul 1s steps(2) infinite}
@keyframes ndpul{50%{transform:scale(1.12)}}
.nd.done{background:#e52521;animation:none}
.nd.lock{filter:grayscale(1);opacity:.75;cursor:not-allowed}
.nd.pop{animation:pp .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pp{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}

.lb{position:absolute;width:220px;text-align:center;font-size:9px;line-height:15px;background:#000000dd;padding:6px 8px;border:3px solid #fff;border-radius:6px;transform:translateX(-50%);pointer-events:none;z-index:7;box-shadow:3px 3px 0 rgba(0,0,0,0.5)}
.arw{position:absolute;font-size:22px;color:#ff2020;text-shadow:2px 2px #000;animation:arwfly .6s steps(2) infinite;pointer-events:none;z-index:9}
@keyframes arwfly{50%{transform:translateY(-8px)}}
.map-title{position:absolute;left:70px;top:80px;font-size:12px;background:#000000cc;padding:8px 12px;border:3px solid #f8d818;border-radius:6px;color:#fff;z-index:7}

/* Fases de Explicação */
.box{position:absolute;background:#fff8dc;color:#1a1a1a;border:6px solid #000;box-shadow:inset 0 0 0 4px #e8c454,6px 6px 0 rgba(0,0,0,0.5);padding:24px;border-radius:10px;z-index:5}
.box h2{font-size:15px;line-height:24px;color:#d81c18;margin-bottom:14px;border-bottom:3px dashed #d81c18;padding-bottom:6px}
.box p{font-size:11px;line-height:22px;letter-spacing:0.5px}
.hd{position:absolute;left:50px;top:20px;font-size:12px;text-shadow:3px 3px #000;line-height:22px;background:#000000b0;padding:6px 12px;border-radius:6px;border:2px solid #fff;z-index:10}
.hd b{color:#f8d818;font-size:15px}

.vis{position:absolute;left:570px;top:100px;width:350px;height:310px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;align-content:center;z-index:5}
.ic{width:105px;background:#000000c8;border:4px solid #fff;border-radius:8px;padding:12px 6px;text-align:center;font-size:9px;line-height:14px;color:#fff;box-shadow:4px 4px 0 rgba(0,0,0,0.4);animation:floatCard 1.6s ease-in-out infinite}
.ic i{display:block;font-style:normal;font-size:38px;margin-bottom:8px}
.ic:nth-child(2){animation-delay:.35s}.ic:nth-child(3){animation-delay:.7s}
@keyframes floatCard{50%{transform:translateY(-10px)}}

.nav{position:absolute;left:40px;right:40px;bottom:22px;display:flex;justify-content:space-between;align-items:center;z-index:15}
.nav-grp{display:flex;gap:10px;align-items:center}
.dots{font-size:18px;letter-spacing:8px;text-shadow:2px 2px #000;color:#f8d818}

/* Inimigos e animações de fase (Galoomba SMW andando da DIREITA para a ESQUERDA) */
.wk{animation:wk_rtl 14s linear infinite}
@keyframes wk_rtl{from{left:1050px}to{left:-90px}}

.sw-cheep{animation:cheepswim 12s linear infinite}@keyframes cheepswim{from{left:1020px}to{left:-100px}}
.sw-bullet{animation:bulletfly 8s linear infinite}@keyframes bulletfly{from{left:1020px}to{left:-120px}}
.bub{position:absolute;bottom:-20px;width:14px;height:14px;border:3px solid #bdf;border-radius:50%;background:rgba(255,255,255,0.3);animation:bubrise 6s linear infinite}
@keyframes bubrise{to{bottom:560px;transform:translateX(20px)}}
.pipe{position:absolute;bottom:90px;width:74px;background:#1cb01c;border:4px solid #000;box-shadow:inset 12px 0 #68ee68,inset -12px 0 #0b680b;z-index:3}
.pipe:before{content:"";position:absolute;left:-10px;right:-10px;top:-4px;height:28px;background:#1cb01c;border:4px solid #000;box-shadow:inset 12px 0 #68ee68,inset -12px 0 #0b680b}

/* Castelo do Bowser */
.brk{position:absolute;inset:0;background:linear-gradient(#00000060,#00000060),repeating-linear-gradient(90deg,#2b2b3b 0 4px,transparent 4px 64px),repeating-linear-gradient(#2b2b3b 0 4px,#484858 4px 44px);background-color:#484858}
.lava{position:absolute;left:0;right:0;bottom:0;height:70px;background:repeating-linear-gradient(90deg,#f82800 0 24px,#f89010 24px 48px);animation:lavawave .7s steps(2) infinite;border-top:4px solid #000;z-index:5}
@keyframes lavawave{50%{background-position:24px 0}}
.brg{position:absolute;bottom:70px;height:30px;background:repeating-linear-gradient(90deg,#999 0 28px,#555 28px 32px);border-top:5px solid #ddd;border-bottom:4px solid #000;z-index:4}
.pod{position:absolute;bottom:60px;width:22px;height:28px;background:#f87000;border:3px solid #ffde59;border-radius:50% 50% 30% 30%;animation:lavapod 2.4s ease-out infinite;z-index:6}
@keyframes lavapod{0%{transform:translateY(0)}45%{transform:translateY(-290px)}90%,100%{transform:translateY(0)}}
.torch{position:absolute;font-size:32px;animation:torchflicker .4s steps(2) infinite;z-index:3}
@keyframes torchflicker{50%{transform:scale(1.15) translateY(-3px)}}

/* Quiz no Castelo */
.qc{position:absolute;left:110px;top:45px;width:740px;background:#14142ccc;border:5px solid #fff;border-radius:10px;box-shadow:6px 6px 0 rgba(0,0,0,0.7);padding:18px;z-index:10}
.qc .st{font-size:10px;color:#f8d818;margin-bottom:12px;display:flex;justify-content:space-between;border-bottom:2px solid #334;padding-bottom:6px}
.qc h3{font-size:13px;line-height:22px;margin-bottom:14px;color:#fff}
.op{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op button{font:inherit;font-size:10px;line-height:16px;text-align:left;padding:12px 10px;background:#183cd0;color:#fff;border:3px solid #fff;border-radius:6px;cursor:pointer;min-height:60px;box-shadow:3px 3px 0 rgba(0,0,0,0.4);transition:background .1s}
.op button:hover:not(:disabled){background:#4268ff;transform:translateY(-2px)}
.op button.ok{background:#18a818!important;border-color:#7fff7f}
.op button.no{background:#c01818!important;opacity:.65;border-color:#ff7f7f}
.msg{font-size:10px;line-height:16px;margin-top:12px;min-height:32px;color:#f8d818;background:#000000a0;padding:6px 10px;border-radius:4px;border-left:4px solid #f8d818}
.shk{animation:shake .35s ease-in-out}@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
#bw{transition:transform 1.8s ease-in,opacity 1.8s;z-index:4}
#bw.fall{transform:translateY(360px) rotate(380deg) scale(0.6);opacity:0}

/* Modal de Vitória / Conclusão */
.fim{position:absolute;left:180px;top:55px;width:600px;background:#14142af0;border:6px solid #fff;border-radius:12px;padding:26px;text-align:center;display:none;z-index:20;box-shadow:0 0 35px rgba(0,0,0,0.9)}
.fim.show{display:block}
.fim p{font-size:10px;line-height:18px;margin:10px 0}

/* Aviso de orientação mobile */
@media (orientation:portrait){#rot{display:flex}}
#rot{display:none;position:fixed;inset:0;background:#000000f5;color:#fff;font-size:12px;line-height:22px;text-align:center;z-index:999;align-items:center;justify-content:center;padding:30px}
</style>
</head>
<body>

<div id="rot">🔄 POR FAVOR, GIRE SEU DISPOSITIVO PARA O MODO PAISAGEM (HORIZONTAL) PARA JOGAR!</div>

<div id="g">
  <!-- Cenas -->
  <div id="title" class="sc"></div>
  <div id="map" class="sc"></div>
  <div id="les" class="sc"></div>
  <div id="cas" class="sc"></div>
  <div id="end" class="sc"></div>

  <!-- Cortina preta de transição -->
  <div id="f"></div>

  <!-- Logo Oficial SENAI Pixelizada -->
  <div id="logo" title="SENAI - Mundo SENAI">
    <img id="logo-img" alt="SENAI">
  </div>

  <!-- Botão de Som no topo esquerdo -->
  <button id="mu" title="Ativar/Desativar Som Retrô">🔊</button>
</div>

/* Ajuste e Redimensionamento Fluido */
function rs(){
  const s=Math.min(innerWidth/960,innerHeight/540);
  G.style.transform=`scale(${s})`;
  G.style.marginLeft=-480*s+'px';
  G.style.marginTop=-270*s+'px';
}

/* =========================================================================
   SINTETIZADOR DE ÁUDIO WEB CHIPTUNE (Efeitos Sonoros e Trilha em Loop)
   ========================================================================= */
let ac,mute=false,bgmTimer=null,bgmStep=0;

function initAudio(){
  if(!ac){
    try{
      ac=new(window.AudioContext||webkitAudioContext)();
      if(ac.state==='suspended'){
        ac.resume();
      }
      startBGM();
    }catch(e){}
  }
}

function bp(f,d,t='square',v=0.06,dl=0){
  if(mute||!ac)return;
  try{
    const o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+dl;
    o.type=t;
    o.frequency.setValueAtTime(f,T);
    g.gain.setValueAtTime(v,T);
    g.gain.linearRampToValueAtTime(0,T+d);
    o.connect(g);g.connect(ac.destination);
    o.start(T);o.stop(T+d);
  }catch(e){}
}

/* SFX do Jogo */
const SFX={
  coin:()=>{bp(988,.08);bp(1319,.35,'square',.07,.08)},
  jump:()=>{bp(320,.07);bp(580,.13,'square',.06,.07)},
  bump:()=>bp(110,.14,'triangle',.18),
  click:()=>bp(660,.05),
  pipe:()=>{bp(320,.1,'triangle',.12);bp(210,.2,'triangle',.12,.1)},
  ok:()=>[523,659,784,1047].forEach((f,i)=>bp(f,.12,'square',.06,i*.09)),
  no:()=>{bp(180,.16,'sawtooth',.08);bp(120,.28,'sawtooth',.08,.15)},
  win:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>bp(f,.13,'square',.07,i*.11)),
  slide:()=>{for(let i=0;i<16;i++)bp(580-i*22,.1,'sine',.04,i*.06)},
  boom:()=>{bp(90,.35,'sawtooth',.16);bp(50,.5,'triangle',.22,.1)}
};

/* Trilha Chiptune Retrô em Loop (Super Mario Theme Inspired) */
const MELODY=[
  659,659,0,659,0,523,659,0,784,0,0,0,392,0,0,0,
  523,0,0,392,0,0,330,0,0,440,0,494,0,466,440,0,
  392,659,784,880,0,698,784,0,659,0,523,587,494,0,0,0
];
const BASS=[
  261,0,392,0,261,0,392,0,196,0,392,0,196,0,392,0,
  220,0,330,0,220,0,330,0,174,0,261,0,174,0,261,0,
  196,0,293,0,196,0,293,0,261,0,392,0,261,0,392,0
];

function startBGM(){
  if(bgmTimer)clearInterval(bgmTimer);
  bgmStep=0;
  bgmTimer=setInterval(()=>{
    if(mute||!ac||ac.state==='suspended')return;
    const mNote=MELODY[bgmStep%MELODY.length];
    const bNote=BASS[bgmStep%BASS.length];
    if(mNote>0)bp(mNote,0.11,'square',0.022);
    if(bNote>0)bp(bNote,0.14,'triangle',0.035);
    bgmStep++;
  },140);
}

$('#mu').onclick=()=>{
  initAudio();
  mute=!mute;
  $('#mu').textContent=mute?'🔇':'🔊';
};

function goHome(){
  if(busy)return;
  initAudio();
  SFX.click();
  go(()=>{
    buildTitle();
    show('title');
    playTitle();
  });
}

const cache={};
function im(k,s=5,st='',id=''){
  if(k==='galoomba'){
    return `<img class="s" ${id?`id="${id}"`:''} src="${GALOOMBA_SRC}" style="width:48px;height:45px;${st}">`;
  }
  if(!cache[k]){
    const m=SP[k],w=Math.max(...m.map(r=>r.length)),c=document.createElement('canvas');
    c.width=w;c.height=m.length;
    const x=c.getContext('2d');
    m.forEach((r,j)=>[...r].forEach((ch,i)=>{
      if(P[ch]){x.fillStyle=P[ch];x.fillRect(i,j,1,1)}
    }));
    cache[k]={u:c.toDataURL(),w,h:m.length};
  }
  const o=cache[k];
  return `<img class="s" ${id?`id="${id}"`:''} src="${o.u}" style="width:${o.w*s}px;height:${o.h*s}px;${st}">`;
}

function mv(el,p,ms,e='linear'){
  el.style.transition=`left ${ms}ms ${e},bottom ${ms}ms ${e},top ${ms}ms ${e},opacity ${ms}ms ${e}`;
  Object.assign(el.style,p);
}

function col(t){
  let i=0;return [...t].map(c=>c===' '?' ':`<span class="c${i++%4}">${c}</span>`).join('');
}

async function playTitle(){
  const m=$('#tm'),b=$('#blk');
  await sl(350);

  // Mario aparece da esquerda andando até o centro embaixo do bloco
  m.classList.add('bob');
  mv(m,{left:440},1500);
  await sl(1500);
  m.classList.remove('bob');
  await sl(100);

  // Mario pula dando uma batidinha com a cabeça no bloco
  SFX.jump();
  mv(m,{bottom:162},220,'ease-out');
  await sl(220);

  // Bate a cabeça no bloco: bloco sobe, fica usado, moeda e título aparecem!
  SFX.bump();
  b.classList.add('hit');
  mv(m,{bottom:90},220,'ease-in'); // Mario cai de volta ao chão
  await sl(100);

  b.classList.remove('hit');
  b.classList.add('used');
  SFX.coin();
  $('#ttl').classList.add('show');
  await sl(650);

  // Mario sai correndo para a direita
  m.classList.add('bob');
  mv(m,{left:1060},1500);
  await sl(1500);

  $('#sb').classList.add('show');
  rdy=true;
}

function refreshMap(prev){
  LV.forEach((l,i)=>{
    const n=$('#nd'+i);
    const isLocked=i>=unlocked;
    const isDone=i<unlocked-1;
    n.className='nd '+(isLocked?'lock':(isDone?'done':'open'));
    if(isLocked)n.textContent='🔒';
    else n.textContent=i<3?i+1:'🏰';
    if(prev!==undefined&&i===unlocked-1&&i>=prev){
      n.classList.add('pop');
    }
  });

  [0,1,2].forEach(i=>{$('#sg'+i).style.opacity=i<unlocked-1?1:.25});
  sel=Math.min(sel,unlocked-1);
  moveArw();
}

function moveArw(){
  $('#aw').style.left=LV[sel].x-11+'px';
  $('#aw').style.top=LV[sel].y-80+'px';
}

async function autoAdvanceMap(fromIdx, toIdx){
  if(toIdx>=LV.length)return;
  busy=true;
  const m=$('#mm');
  m.style.left=(LV[fromIdx].x-32)+'px';
  m.style.top=(LV[fromIdx].y-68)+'px';
  sel=fromIdx;
  cur=fromIdx;
  moveArw();
  await sl(450);

  // Mario caminha suavemente até a nova fase desbloqueada
  m.classList.add('bob');
  SFX.click();
  mv(m,{left:LV[toIdx].x-32,top:LV[toIdx].y-68},1100);
  await sl(1100);
  m.classList.remove('bob');

  cur=toIdx;
  sel=toIdx;
  moveArw();
  SFX.pipe();

  const nextNode=$('#nd'+toIdx);
  if(nextNode)nextNode.classList.add('pop');
  busy=false;
}

async function enter(i){
  if(busy||i>=unlocked)return;
  initAudio();
  sel=i;
  moveArw();
  SFX.click();
  busy=true;

  if(cur!==i){
    $('#mm').classList.add('bob');
    mv($('#mm'),{left:LV[i].x-32,top:LV[i].y-68},900);
    await sl(900);
    $('#mm').classList.remove('bob');
  }
  cur=i;
  busy=false;
  SFX.pipe();

  go(()=>{
    if(i<3)openLesson(i);
    else openCastle();
  });
}

  }).join('');

  $('#dt').innerHTML=LES[lv].map((_,k)=>k===sl_i?'★':'·').join('');
  $('#pv').disabled=sl_i===0;
  $('#nx').textContent=sl_i===3?'CONCLUIR FASE ★':'PRÓXIMO ▶';
}

function step(d){
  if(busy)return;
  initAudio();
  SFX.click();
  if(d>0&&sl_i===3){
    const prevUnlocked=unlocked;
    const completedIdx=lv;
    const nextIdx=lv+1;
    unlocked=Math.max(unlocked,nextIdx+1);
    SFX.win();
    go(async ()=>{
      show('map');
      refreshMap(prevUnlocked);
      await autoAdvanceMap(completedIdx, nextIdx);
    });
    return;
  }
  if(sl_i+d<0)return;
  sl_i+=d;
  rSlide();
}

function backMap(){
  if(busy)return;
  initAudio();
  SFX.click();
  go(()=>{show('map');refreshMap()});
}

function rQ(){
  const q=Q[room],c=$('#qc');
  c.style.display='block';
  c.innerHTML=`
    <div class="st">
      <span>DESAFIO DO CASTELO · SALA ${room+1}/5 (${q[0]})</span>
      <span>${[0,1,2,3,4].map(i=>i<room?'🔓':i===room?'🚪':'🔒').join('')}</span>
    </div>
    <h3>${q[1]}</h3>
    <div class="op">
      ${q[2].map((o,i)=>`<button data-i="${i}"><b>${'ABCD'[i]})</b> ${o}</button>`).join('')}
    </div>
    <div class="msg" id="ms">Escolha a resposta correta (toque na tela ou aperte 1, 2, 3 ou 4).</div>`;

  c.querySelectorAll('button').forEach(b=>b.onclick=()=>ans(+b.dataset.i));
}

async function ans(i){
  if(busy||scene!=='cas'||room>4)return;
  initAudio();
  const q=Q[room],b=$('#qc').querySelectorAll('button')[i];
  if(b.disabled)return;

  if(i===q[3]){
    // Resposta Correta
    busy=true;
    b.classList.add('ok');
    SFX.ok();
    $('#ms').textContent='RESPOSTA EXATA! A porta da próxima sala foi aberta...';
    await sl(1200);
    busy=false;
    room++;
    if(room<5){
      SFX.pipe();
      rQ();
    }else{
      defeat();
    }
  }else{
    // Resposta Errada (Tentativas ilimitadas com dica)
    b.classList.add('no');
    b.disabled=true;
    SFX.no();
    $('#ms').textContent='RESPOSTA INCORRETA! Tente novamente. DICA: '+q[4];
    
    // Tremor na caixa de pergunta e avanço do Bowser
    const c=$('#qc');
    c.classList.remove('shk');
    void c.offsetWidth;
    c.classList.add('shk');

    $('#bw').style.transform='translateX(-18px)';
    setTimeout(()=>$('#bw').style.transform='',280);
  }
}

async function defeat(){
  busy=true;
  $('#qc').style.display='none';
  SFX.win();
  await sl(300);

  // O chão NÃO cai! Apenas o Bowser cai girando na lava
  SFX.boom();
  $('#bw').classList.add('fall');
  await sl(1600);

  // Peach surge comemorando
  $('#cp').style.display='block';
  $('#cp').classList.add('bob');
  SFX.coin();
  await sl(600);

  $('#vic').classList.add('show');
  busy=false;
}

  $('#again').onclick=()=>{

async function playEnd(){
  const M=$('#em'),P=$('#ep'),MS=$('#ems'),fl=$('#fl');
  await sl(300);

  // 1. Mario e Peach saem do castelo juntos até o centro
  M.style.opacity=P.style.opacity=1;
  M.classList.add('bob');
  P.classList.add('bob');

  mv(P,{left:360},2400);
  mv(M,{left:380},2400);
  await sl(2450);

  M.classList.remove('bob');
  P.classList.remove('bob');
  await sl(250);

  // 2. Mario anda em direção inclinada (diagonal) até o topo do mastro!
  // Move-se suavemente de (left: 380, bottom: 90) até o topo (left: 605, bottom: 345)
  SFX.jump();
  M.classList.add('bob');
  mv(M,{left:605,bottom:345},1000,'linear');
  await sl(1020);
  M.classList.remove('bob');

  // 3. Mario agarra o mastro no topo em postura de bombeiro
  M.style.display='none';
  MS.style.display='block';
  MS.style.left='605px';
  MS.style.bottom='345px';
  fl.style.top='120px';
  await sl(150);

  // 4. Mario e a bandeira descem juntos pixel a pixel até o chão!
  SFX.slide();
  const startBottom = 345;
  const targetBottom = 90;
  const startTop = 120;
  const targetTop = 375;
  const duration = 2400; // ms
  const startTime = performance.now();

  await new Promise(resolve => {
    function step(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      
      // Movimento pixel a pixel em sincronia absoluta
      const currentBottom = Math.round(startBottom - (startBottom - targetBottom) * progress);
      const currentTop = Math.round(startTop + (targetTop - startTop) * progress);
      
      MS.style.bottom = currentBottom + 'px';
      fl.style.top = currentTop + 'px';
      
      // Efeito de movimento sutil nos pés
      if (Math.floor(elapsed / 120) % 2 === 0) {
        MS.style.transform = 'translateY(-2px)';
      } else {
        MS.style.transform = 'translateY(0px)';
      }

      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        MS.style.transform = 'none';
        resolve();
      }
    }
    requestAnimationFrame(step);
  });

  // 5. Chegada ao chão
  MS.style.display='none';
  M.style.display='block';
  M.style.bottom='90px';
  M.style.left='605px';
  SFX.win();

  await sl(400);

  // 6. Peach se aproxima do Mario
  P.classList.add('bob');
  mv(P,{left:540},600);
  await sl(650);
  P.classList.remove('bob');

  await sl(400);

  // 7. Mario e Peach saem juntos pela direita
  M.classList.add('bob');
  P.classList.add('bob');
  mv(M,{left:1060},2000);
  await sl(250);
  mv(P,{left:1060},2100);
  await sl(2200);

  // 8. Exibe tela final de agradecimentos e créditos
  $('#fim').classList.add('show');
}

/* =========================================================================
   CONTROLES (Teclado e Toque Direto na Tela)
   ========================================================================= */
function handleNav(dir){
  if(busy)return;
  initAudio();
  if(scene==='map'){
    if(dir==='right'||dir==='down'){
      sel=Math.min(sel+1,unlocked-1);
      moveArw();
      SFX.click();
    }else if(dir==='left'||dir==='up'){
      sel=Math.max(sel-1,0);
      moveArw();
      SFX.click();
    }
  }else if(scene==='les'){
    if(dir==='right')step(1);
    else if(dir==='left')step(-1);
  }
}

function handleAction(act){
  if(busy)return;
  initAudio();
  if(act==='A'){
    if(scene==='title'&&rdy)startGame();
    else if(scene==='map')enter(sel);
    else if(scene==='les')step(1);
    else if(scene==='end'&&$('#fim').classList.contains('show'))$('#again').click();
  }else if(act==='B'){
    if(scene==='les')backMap();
    else if(scene==='cas')backMap();
  }
}

// Teclado Físico
addEventListener('keydown',e=>{
  if(busy)return;
  initAudio();
  const k=e.key;
  if(k==='ArrowRight')handleNav('right');
  else if(k==='ArrowLeft')handleNav('left');
  else if(k==='ArrowDown')handleNav('down');
  else if(k==='ArrowUp')handleNav('up');
  else if(k==='Enter'||k===' ')handleAction('A');
  else if(k==='Escape'||k==='Backspace')handleAction('B');
  else if(scene==='cas'&&'1234'.includes(k)&&k){
    ans(+k-1);
  }
});

// Início do Jogo
buildTitle();
show('title');
playTitle();

// Desbloqueia áudio ao primeiro toque ou clique na tela
document.addEventListener('pointerdown',()=>initAudio(),{once:true});

/* seta para a esquerda = espelho da direita */
(()=>{const r=D.arr_r.split('/'),w=Math.max(...r.map(x=>x.length));D.arr_l=r.map(x=>[...x.padEnd(w,'.')].reverse().join('')).join('/');})();

const U={};
function url(n){
  if(U[n])return U[n];
  const m=D[n].split('/'),w=Math.max(...m.map(r=>r.length)),c=document.createElement('canvas'),x=c.getContext('2d');
  c.width=w;c.height=m.length;
  m.forEach((r,j)=>[...r].forEach((ch,i)=>{if(C[ch]){x.fillStyle=C[ch];x.fillRect(i,j,1,1)}}));
  return U[n]=c.toDataURL();
}

const EM=[['▶\uFE0F','play'],['🔊','snd'],['🔇','mute'],['🔄','rot'],['🏠','home'],['🔒','lock'],['🔓','unlock'],['🚪','door'],['🏰','castle'],['🔥','fire'],['📱','phone'],['🎮','pad'],['💻','pc'],['🪟','win'],['🛋','sofa'],['🦠','virus'],['🧪','flask'],['✅','check'],['🐧','tux'],['🍎','apple'],['🕹','joy'],['💾','disk'],['✨','spark'],['☁','cloud'],['💰','coin'],['🏫','school'],['🧠','chip'],['🧩','puzzle'],['⚖','scale'],['🎚','slider'],['💿','cd'],['⚙','gear'],['⚡','bolt'],['⏹','stop'],['🗑','bin'],['❤','heart'],['★','star'],['▶','arr_r'],['◀','arr_l'],['▼','arr_d'],['↻','rot'],['·','dot']];
const M={};EM.forEach(([e,n])=>M[e]=n);
const pat=EM.map(([e])=>e==='▶'||e.includes('\uFE0F')?e:e+'\uFE0F?').join('|');
const rt=new RegExp(pat),rg=new RegExp(pat,'g');

function fix(t){
  const s=t.nodeValue;
  if(!s||!rt.test(s))return;
  const p=t.parentNode,dots=p&&p.closest&&p.closest('#dt');
  const f=document.createDocumentFragment();let last=0,ch=false;
  s.replace(rg,(m,off)=>{
    const n=M[m]||M[m.replace(/\uFE0F/g,'')];
    if(!n||(n==='dot'&&!dots))return m;
    if(off>last)f.appendChild(document.createTextNode(s.slice(last,off)));
    const i=new Image();i.className='px';i.alt='';i.draggable=false;i.src=url(n);
    f.appendChild(i);last=off+m.length;ch=true;return m;
  });
  if(!ch)return;
  if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
  p.replaceChild(f,t);
}
function walk(n){
  if(n.nodeType===3){fix(n);return}
  if(n.nodeType!==1||/^(SCRIPT|STYLE)$/.test(n.tagName))return;
  [...n.childNodes].forEach(walk);
}
